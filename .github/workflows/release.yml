name: Release

# release-plz.yml publishes to crates.io and pushes the `vX.Y.Z` tag (with an
# App token, so this tag push fires other workflows). This workflow picks up
# from that tag: build platform binaries, attach them to the draft GH Release
# release-plz created, flip it to non-draft, and publish npm packages.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # crates.io publish + tag creation now live in release-plz.yml's `release`
  # job (gated by the Release PR merge, not an environment approval). This
  # workflow starts from the pushed `vX.Y.Z` tag, so all it needs up front is
  # the bare version (tag name minus the leading `v`) as a shared job output.
  setup:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Validate semver format
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version from tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            rustflags: "-C link-arg=-fuse-ld=mold"
            install-mold: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            rustflags: ""
            install-mold: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            rustflags: "-C link-arg=-fuse-ld=mold"
            install-mold: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rustflags: ""
            install-mold: false
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            rustflags: ""
            install-mold: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            rustflags: "-C linker=lld-link"
            install-mold: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "v${{ needs.setup.outputs.version }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-release

      - name: Install mold
        if: matrix.install-mold
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Configure linker
        if: matrix.rustflags != ''
        shell: bash
        run: echo "RUSTFLAGS=${{ matrix.rustflags }}" >> $GITHUB_ENV

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --bin fulgur -p fulgur-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../fulgur-v${{ needs.setup.outputs.version }}-${{ matrix.target }}.tar.gz fulgur
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/fulgur.exe" -DestinationPath "fulgur-v${{ needs.setup.outputs.version }}-${{ matrix.target }}.zip"

      - name: Stage npm binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p npm-bin
          cp target/${{ matrix.target }}/release/fulgur npm-bin/fulgur

      - name: Stage npm binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force npm-bin
          Copy-Item "target/${{ matrix.target }}/release/fulgur.exe" "npm-bin/fulgur.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: npm-bin/

      - uses: actions/upload-artifact@v7
        with:
          name: fulgur-${{ matrix.target }}
          path: fulgur-v${{ needs.setup.outputs.version }}-${{ matrix.target }}.*

  release:
    name: Publish GitHub Release
    needs: [setup, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: 'fulgur-*'
          merge-multiple: true

      # GITHUB_TOKEN で発火した release:published は別 workflow を起動しない
      # (無限ループ防止仕様)。release-python.yml / release-ruby.yml を連鎖発火
      # させるため、App token で publish する。
      # 手順は docs/RELEASE_SETUP.md を参照。
      - name: Generate App token for release publish
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Upload binaries and publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          REPO="${{ github.repository }}"
          # Create release if draft doesn't exist (fallback)
          if ! gh release view "v$VERSION" --repo "$REPO" &>/dev/null; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "Release v$VERSION" \
              --draft \
              --repo "$REPO"
          fi
          # Upload binaries and publish (App token → release:published が連鎖発火)
          # --clobber: approval gate reject 等での re-run 時に同名 asset を上書き
          gh release upload "v$VERSION" artifacts/* --clobber --repo "$REPO"
          gh release edit "v$VERSION" --draft=false --repo "$REPO"

  publish-npm:
    name: Publish npm packages
    needs: [setup, build-binaries]
    # KNOWN TEMPORARY REGRESSION (fulgur-n5tw → to be fixed in fulgur-f7o2):
    # this workflow now triggers on tag push, so `github.event.pull_request`
    # no longer exists and the previous `release:skip-bindings` label gate
    # (`!contains(github.event.pull_request.labels.*.name, ...)`) cannot be
    # evaluated. npm publish is therefore unconditional for now. release-python
    # / release-ruby already reverse-look-up the merged PR's labels via the GH
    # API on `release:published`; f7o2 will give npm the same treatment.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: "v${{ needs.setup.outputs.version }}"

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all npm artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: npm-artifacts
          merge-multiple: false

      - name: Publish platform packages
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -e
          declare -A TARGET_TO_DIR=(
            ["x86_64-unknown-linux-gnu"]="linux-x64"
            ["x86_64-unknown-linux-musl"]="linux-x64-musl"
            ["aarch64-unknown-linux-gnu"]="linux-arm64"
            ["aarch64-apple-darwin"]="darwin-arm64"
            ["x86_64-apple-darwin"]="darwin-x64"
            ["x86_64-pc-windows-msvc"]="win32-x64"
          )

          for target in "${!TARGET_TO_DIR[@]}"; do
            dir="${TARGET_TO_DIR[$target]}"
            pkg_dir="packages/npm/$dir"
            artifact_dir="npm-artifacts/npm-$target"

            if [ -f "$artifact_dir/fulgur.exe" ]; then
              cp "$artifact_dir/fulgur.exe" "$pkg_dir/bin/fulgur.exe"
            else
              cp "$artifact_dir/fulgur" "$pkg_dir/bin/fulgur"
              chmod +x "$pkg_dir/bin/fulgur"
            fi

            cd "$pkg_dir"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            PKG_NAME=$(node -p "require('./package.json').name")
            if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
              echo "Already published ${PKG_NAME}@${VERSION}, skipping."
            else
              npm publish --access public --provenance
            fi
            cd - > /dev/null
          done

      - name: Publish meta package
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd packages/npm/meta
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.VERSION;
            for (const k of Object.keys(pkg.optionalDependencies)) {
              pkg.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "${PKG_NAME}@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "Already published ${PKG_NAME}@${VERSION}, skipping."
          else
            npm publish --access public --provenance
          fi
