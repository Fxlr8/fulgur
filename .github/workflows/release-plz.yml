name: Release-plz

# Least privilege: keep the top-level default read-only and grant write only to
# the jobs that need it (release-pr creates/updates the Release PR; release has
# its own permissions block below).
permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the Release PR branch + aux-file-sync commit
      pull-requests: write    # create/update the Release PR
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Create the Release PR (and push the aux-file-sync commit) as the release
      # App, NOT the default GITHUB_TOKEN. A PR/commit authored via GITHUB_TOKEN
      # does not fire other workflows, so ci.yml would never run on the Release
      # PR and every release would need CI kicked off by hand. Requires the App
      # to have Pull requests + Contents: Read and write.
      - name: Generate App token for the Release PR
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: release-pr creates/updates the PR + pushes the
          # branch; release creates the tag/GH Release (POST /git/refs,
          # /releases) and reads associated PRs for contributors. Both are
          # fully covered by contents+pull-requests write. Tag creation is via
          # the API, not git push, so no `workflows` permission is needed.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Persist the App token so the aux-file-sync step's git push is also
          # App-authored (and thus triggers CI on the Release PR).
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur
          save-if: false

      - name: Run release-plz release-pr
        id: release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7  # v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: ruby/setup-ruby@v1.312.0
        if: fromJSON(steps.release-plz.outputs.pr).number
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Sync auxiliary version files onto the release PR branch
        if: fromJSON(steps.release-plz.outputs.pr).number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          PR_NUMBER=${{ fromJSON(steps.release-plz.outputs.pr).number }}
          gh pr checkout "$PR_NUMBER"

          VERSION=$(grep '^version = ' crates/fulgur/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || {
            echo "::error::Failed to extract a valid version from crates/fulgur/Cargo.toml"
            exit 1
          }

          # Mirrors the sed steps release-prepare.yml used to run — release-plz
          # only updates Cargo.toml/Cargo.lock/CHANGELOG.md, it has no hook to
          # touch these non-Cargo manifests (confirmed in fulgur-7b3l notes).
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/pyfulgur/pyproject.toml
          grep -Eq "^version = \"$VERSION\"$" crates/pyfulgur/pyproject.toml || {
            echo "::error::Failed to sync version in crates/pyfulgur/pyproject.toml"
            exit 1
          }
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/fulgur-ruby/ext/fulgur/Cargo.toml
          grep -Eq "^version = \"$VERSION\"$" crates/fulgur-ruby/ext/fulgur/Cargo.toml || {
            echo "::error::Failed to sync version in crates/fulgur-ruby/ext/fulgur/Cargo.toml"
            exit 1
          }
          sed -i "s/^fulgur = \"[^\"]*\"$/fulgur = \"$VERSION\"/" crates/fulgur-ruby/ext/fulgur/Cargo.toml
          grep -Eq "^fulgur = \"$VERSION\"$" crates/fulgur-ruby/ext/fulgur/Cargo.toml || {
            echo "::error::Failed to sync fulgur dependency version in crates/fulgur-ruby/ext/fulgur/Cargo.toml"
            exit 1
          }
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" crates/fulgur-ruby/lib/fulgur/version.rb
          grep -Eq "^[[:space:]]*VERSION = \"$VERSION\"$" crates/fulgur-ruby/lib/fulgur/version.rb || {
            echo "::error::Failed to sync version in crates/fulgur-ruby/lib/fulgur/version.rb"
            exit 1
          }

          (cd crates/fulgur-ruby && bundle install)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync auxiliary version files to $VERSION" || echo "no changes to sync"
          git push

  release:
    name: Release-plz release
    needs: release-pr
    runs-on: ubuntu-latest
    # Serialize publishing so a main push that lands while a release is still
    # in flight can't start a second `release-plz release` from a newer SHA and
    # race the first for the same version. Queued runs are harmless: release-plz
    # skips a version already published to crates.io.
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    # `environment: release` stamps the OIDC token with an `environment` claim
    # so it matches the crates.io Trusted Publisher (registered with
    # Environment = release), scoping the publisher to this workflow + env.
    environment: release
    permissions:
      contents: write
      id-token: write  # required by rust-lang/crates-io-auth-action (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-fulgur
          save-if: false

      # GITHUB_TOKEN's tag push / GH Release creation would not trigger the
      # build-binaries/release/publish-npm jobs in release.yml (GITHUB_TOKEN-
      # authored events don't fire other workflows). Use the same App token
      # release.yml already uses for this reason.
      #
      # This works because release-plz creates the `vX.Y.Z` tag via the GitHub
      # API (github_client.create_tag) using the token passed below as
      # GITHUB_TOKEN — the App token — so the tag-push event is App-authored and
      # fires release.yml. The checkout above keeps the DEFAULT GITHUB_TOKEN in
      # its git credentials, which is fine: this job never `git push`es.
      # CAUTION: release-plz only takes the API path when tags are unsigned. If
      # you ever enable tag signing (git config tag.gpgSign true) or add a
      # `git push` step here, release-plz falls back to the git CLI, which would
      # use the default token and SILENTLY break the release.yml cascade — you
      # must then also persist the App token into this checkout's credentials.
      - name: Generate App token for tag/release push
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: release-pr creates/updates the PR + pushes the
          # branch; release creates the tag/GH Release (POST /git/refs,
          # /releases) and reads associated PRs for contributors. Both are
          # fully covered by contents+pull-requests write. Tag creation is via
          # the API, not git push, so no `workflows` permission is needed.
          permission-contents: write
          permission-pull-requests: write

      - name: Authenticate to crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Run release-plz release
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7  # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
