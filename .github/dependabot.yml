version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    cooldown:
      default-days: 7
    groups:
      actions-artifact:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
        update-types:
          - major
          - minor
          - patch
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /crates/pyfulgur
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      pyfulgur-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - website
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      website-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: bundler
    directory: /crates/fulgur-ruby
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ruby
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      ruby-minor-patch:
        update-types:
          - minor
          - patch

  # No npm ecosystem entries for packages/npm/*:
  #   - packages/npm/{linux-x64,linux-x64-musl,linux-arm64,darwin-arm64,darwin-x64,win32-x64}
  #     each ship a package.json with no `dependencies` block — nothing for
  #     Dependabot to update.
  #   - packages/npm/meta has `optionalDependencies` pinning the per-platform
  #     sub-packages, but those versions move in lockstep with the workspace
  #     crates and are rewritten in release-plz.yml's aux-file-sync step (and
  #     again as a safety net by release.yml's `Publish meta package` step at
  #     publish time). Letting Dependabot chase them just files churn PRs
  #     that can never catch the release cadence. See fulgur-yzky.
